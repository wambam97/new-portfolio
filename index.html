<!DOCTYPE html>
<html lang="en" class="home-snap">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ram Salim's Portfolio</title>
    <link rel="stylesheet" href="project.css">
</head>
<body class="home-page">

    <!-- Header & Modal Injection Point -->
    <div id="nav-placeholder"></div>

    <div class="hero-fixed">
        <video muted playsinline autoplay loop class="hero-placeholder-graphic hero-video"></video>
    </div>

    <!-- Scrollable Projects Section (Home Page Only) -->
    <div class="projects-reveal" id="projects-section">
        <!-- The grid will be injected here on load -->
        <div id="home-grid-container"></div>
    </div>

    <!-- Universal Script -->
    <script src="main.js"></script>
    
    <script>
        const heroVideo = document.querySelector('.hero-video');
        if (heroVideo) {
            const isMobile = window.matchMedia('(max-width: 900px)').matches;
            heroVideo.src = isMobile
                ? 'assets/home/main-title-mobile.mp4'
                : 'assets/home/main-title-test4.mp4';
            heroVideo.load();
            heroVideo.play().catch(err => console.warn('Autoplay blocked:', err));
        }
    </script>
</body>
</html>
